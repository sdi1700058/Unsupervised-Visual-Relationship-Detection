
name : fosae
dependencies:
  # Sherlock pins python/3.6.1 (sh/sherlock_config.sh); this env is one minor
  # version ahead, so 3.7-only syntax passes here and fails there. Run
  # `python3 tools/check_py36.py` before pushing anything on the cluster path.
  - python=3.7
  - pip
  - pip:
      - tensorflow-gpu==1.15.2
      - keras==2.2.5
      - h5py<3.0
      - matplotlib
      - progressbar2
      - keras-adabound==0.6.0          # 0.6.0 is the highest version on PyPI
      - keras-rectified-adam==0.9.0    # pinned to a Keras-2-compatible version
      - timeout_decorator
      - ansicolors
      - scipy==1.4.1
      - scikit-image
      - imageio
      - pillow
      - protobuf==3.20.3
